name: Deploy Valheim e painel web

on:
  push:
    branches:
      - valheimserver-docker
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Atualizar servidor e interface HTTPS
    runs-on:
      - self-hosted
      - valheim

    concurrency:
      group: valheim-deploy
      cancel-in-progress: false

    steps:
      - name: Atualizar projeto no servidor
        shell: bash
        working-directory: /home/alessandro/valheim-server
        run: |
          git fetch origin valheimserver-docker
          git checkout valheimserver-docker
          git pull --ff-only origin valheimserver-docker

      - name: Verificar Docker
        shell: bash
        run: |
          docker version
          docker compose version

      - name: Validar projeto e sintaxe da aplicação web
        shell: bash
        working-directory: /home/alessandro/valheim-server
        run: |
          docker compose config --quiet
          docker compose build --pull web
          docker compose run --rm --no-deps --entrypoint python web -m py_compile app.py

      - name: Atualizar imagens e aplicar mudanças
        shell: bash
        working-directory: /home/alessandro/valheim-server
        run: |
          docker compose pull valheim
          docker compose up -d --build --force-recreate --remove-orphans

      - name: Confirmar serviços e HTTPS
        shell: bash
        working-directory: /home/alessandro/valheim-server
        run: |
          docker compose ps
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --insecure https://127.0.0.1:8443/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=200 web
          exit 1
